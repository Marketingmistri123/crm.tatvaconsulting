<style>

.board{gap:12px}.col{background:transparent;padding:0;min-width:240px;width:240px}

.col .card{padding:11px;margin-bottom:8px;display:flex;flex-direction:column;gap:8px}.card small{color:var(--mu)}

.fm{flex:1;min-width:180px;display:flex;flex-direction:column}.fm span{color:var(--mu);font-size:12.5px;display:flex;align-items:center;gap:6px;margin-top:3px}.fa{display:flex;gap:6px;flex-wrap:wrap}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:14px}.grid details{margin:0}summary{cursor:pointer;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.tabs{border-bottom:1px solid var(--bd)}.pn{border-left:1px solid var(--bd)}

.dbar{display:flex;gap:8px;align-items:center;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:2;flex-wrap:wrap}

.ded{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px}.irow{display:grid;grid-template-columns:1fr 62px 92px 30px;gap:6px;margin-bottom:6px}
.paper{background:#fff;color:#111;border-radius:6px;padding:36px;box-shadow:var(--sh);border:1px solid var(--bd);font-size:13px;max-width:820px}

.pb{margin-bottom:16px;line-height:1.5}.pb b{display:block}.tot{margin:12px 0 0 auto;width:min(280px,100%)}.tot div{display:flex;justify-content:space-between;padding:4px 0}
.gt{border-top:2px solid #111;font-weight:700;font-size:15px;margin-top:4px}.pn2{margin-top:16px}.sig{margin-top:40px;text-align:right}
@media print{body>*:not(#dc){display:none!important}#dc{position:static;display:block!important;background:#fff;overflow:visible}.noprint{display:none!important}.dwrap{display:block;padding:0}.paper{box-shadow:none;border:0;padding:0;max-width:none}}
@media(max-width:860px){body{grid-template-columns:1fr}header{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;padding:8px 10px;border-right:0;border-bottom:1px solid var(--bd);z-index:15;gap:10px}nav{flex-direction:row;overflow-x:auto}.brand h1{display:none}.add{margin:0;white-space:nowrap}main{padding:18px 14px 60px}.two,.dwrap{grid-template-columns:1fr}}

</head><body>
<header><div class="brand"><div class="logo"></div><h1>Tatva CRM</h1></div><nav id="nav"></nav></header>
<main id="m"></main>
<div id="dr"><div class="pn" id="pn"></div></div>
<div id="ts" role="status"></div>
<div id="dc"></div>
<script>
const ST=['New lead','Contacted','Call booked','Call done','Audit ready','Proposal sent','Won','Lost'];
const PLANS={'Start (3 months)':20000,'Start (1 year)':80000,'Advance (1 year)':150000,'Growth':200000};
const PROB=['Not enough leads','Poor lead quality','Low conversion','No follow-up system','Weak pricing/offer','Team/operations'];
let S={leads:[],tab:'dash',open:null,dt:'ov',seg:'0',cfg:{me:'Team Tatva',co:'Tatva Consulting',book:'(booking link)',upi:'(UPI ID / payment link)',tpl:{}}};
const SEQ={welcome:{n:'New lead welcome',s:[[0.1,'welcome','Send WhatsApp welcome'],[24,'book','Send booking link'],[72,'nudge','Gentle nudge']]},noshow:{n:'No-show recovery',s:[[1,'noshow','Send reschedule message'],[48,'nudge','Second nudge']]},proposal:{n:'Quotation follow-up',s:[[24,'quote_fu','Quotation follow-up'],[72,'quote_fu2','Second follow-up'],[120,'final','Final follow-up']]},onboard:{n:'Client onboarding',s:[[1,'thanks','Welcome and next steps'],[168,'review','Ask for feedback'],[336,'referral','Ask for referral']]},revive:{n:'Lost lead revival',s:[[720,'revive','Revive with a new offer'],[1440,'case','Share a case study']]}};
const TP={welcome:{n:'Welcome',t:`Namaste {name} ji,\n{co} se {me} bol raha hoon. Aapne {inst} ki growth ke liye form bhara tha. Main 2 minute me bata sakta hoon ki hum kaise madad karte hain. Baat karne ke liye kaunsa samay theek rahega?`},book:{n:'Booking link',t:`{name} ji, apna free diagnostic session yahan book kijiye: {book}\nIs session me hum {inst} ke leads, follow-up aur conversion ka audit karenge.`},confirm:{n:'Booking confirmation',t:`{name} ji, aapka diagnostic session confirm ho gaya hai.\nSamay: {time}\nMeet link calendar invite me hai. Kripya apne leads aur admissions ka data saath rakhein.\n– {me}, {co}`},remind1d:{n:'Reminder · 1 day',t:`Reminder: {name} ji, kal {time} par aapka {co} diagnostic session hai. Samay badalna ho to is message ka reply kar dijiye.`},remind1h:{n:'Reminder · 1 hour',t:`{name} ji, 1 ghante me aapka session hai ({time}). Meet link calendar invite me hai. Milte hain!`},remind10:{n:'Reminder · 10 minutes',t:`{name} ji, session 10 minute me shuru ho raha hai. Kripya Meet link se jud jaiye.`},noshow:{n:'No-show reschedule',t:`{name} ji, aaj aap session me nahi aa paye, koi baat nahi. Naya samay yahan chun lijiye: {book}\nHum {inst} ke audit ke liye taiyaar hain.`},nudge:{n:'Gentle nudge',t:`{name} ji, kya aapne {inst} ke liye session ke bare me socha? Koi sawal ho to bata dijiye, main 5 minute call par samjha dunga.\n(Band karne ke liye STOP likhein.)`},audit:{n:'Audit ready',t:`{name} ji, {inst} ka diagnostic audit taiyaar hai. Isme humne sabse badi kamiyan aur unke solution nikale hain. Kya hum 15 minute me samjha sakte hain? Aapko kaunsa samay theek rahega?`},quote:{n:'Quotation',t:`{name} ji, {inst} ke liye hamara quotation ({qno}):\n{items}\n\nTotal: {amount} {gst}\nValid till: {valid}\n\nKoi sawal ho ya plan me badlav chahiye to bata dijiye.\n– {me}, {co}`},quote_fu:{n:'Quote follow-up 1',t:`{name} ji, kya aapne quotation {qno} dekh liya? Koi sawal ya badlav ho to bata dijiye, main call par samjha dunga.`},quote_fu2:{n:'Quote follow-up 2',t:`{name} ji, quotation {qno} {valid} tak valid hai. Chahein to hum plan aapke budget ke hisab se adjust kar sakte hain.`},final:{n:'Final follow-up',t:`{name} ji, yeh aakhri follow-up hai: quotation {qno} jald expire hoga. Abhi sahi samay nahi hai to bata dijiye, hum baad me connect kar lenge.`},invoice:{n:'Payment details',t:`{name} ji, aapke plan ({plan}) ki payment details:\nAmount: {amount}\nPayment: {upi}\nPayment ke baad screenshot share kar dijiye.\n– {co}`},thanks:{n:'Onboarding welcome',t:`{name} ji, {co} se judne ke liye shukriya! Agla kadam onboarding call hai: {book}\nHum jald kaam shuru karenge.\n– {me}`},review:{n:'Feedback request',t:`{name} ji, kaam kaisa chal raha hai? Aapka 1 minute ka feedback hume aur behtar banane me madad karega.\n(Band karne ke liye STOP likhein.)`},referral:{n:'Referral request',t:`{name} ji, agar aapke kisi institute-owner dost ko growth me madad chahiye to unhe hamare bare me batayein, hum unki poori madad karenge.\n(Band karne ke liye STOP likhein.)`},revive:{n:'Revival offer',t:`{name} ji, kuch samay pehle baat hui thi. Hum {inst} jaise institutes ke liye ek naya growth plan share kar rahe hain. Kya aap 10 minute dekhna chahenge?\n(Band karne ke liye STOP likhein.)`},case:{n:'Case study',t:`{name} ji, hamare ek institute client ki case study aapke saath share karna chahta hoon. Bhej doon?\n(Band karne ke liye STOP likhein.)`}};
const fdate=x=>new Date(x).toLocaleDateString('en-IN',{dateStyle:'medium'});
function saveCfg(){try{localStorage.setItem('tatva_cfg',JSON.stringify(S.cfg))}catch(e){}}
function cfg(k,v){S.cfg[k]=v;saveCfg()}
function getTpl(k){return S.cfg.tpl[k]||TP[k].t}
function setTpl(k,v){if(v)S.cfg.tpl[k]=v;else delete S.cfg.tpl[k];saveCfg()}
function fill(t,l,q){q=q||(l.quotes||[]).slice(-1)[0];const c=S.cfg,v={name:l.name.split(' ')[0],inst:l.inst||'aapka institute',me:c.me,co:c.co,book:c.book,upi:c.upi,time:l.meeting?fd(l.meeting):'tay samay par',plan:q?q.items.map(x=>x.n).join(', '):'',amount:q?inr(q.total):'',valid:q?fdate(q.valid):'',qno:q?q.no:'',gst:q&&q.gst?'(18% GST sahit)':'(GST alag se)',items:q?q.items.map(x=>'• '+x.n+' – '+inr(x.a)).join('\n')+(q.disc?'\nDiscount: '+q.disc+'%':''):''};return t.replace(/\{(\w+)\}/g,(m,k)=>k in v?v[k]:m)}
function waLink(l,key,txt,q){return 'https://wa.me/91'+l.phone.replace(/\D/g,'').slice(-10)+'?text='+encodeURIComponent(txt||fill(getTpl(key),l,q))}
function enroll(l,k){l.tasks=l.tasks.filter(t=>t.done||!t.seq);SEQ[k].s.forEach(s=>addTask(l,s[2],s[0],s[1],k));log(l,'Sequence started: '+SEQ[k].n)}
function sentWa(id,i){setTimeout(()=>{const l=find(id),t=l.tasks[i];t.done=true;log(l,'WhatsApp sent: '+t.t);save();render()},300)}
function snooze(id,i){const l=find(id);l.tasks[i].due=new Date(Date.now()+864e5).toISOString();save();render()}
function noshow(){const l=find(S.open);log(l,'Marked no-show');enroll(l,'noshow');save();render()}
function addNote(){const l=find(S.open),v=$('nt').value.trim();if(!v)return;log(l,'Note: '+v);save();render()}
function mkQ(){const l=find(S.open),it=[...document.querySelectorAll('.qc:checked')].map(c=>({n:c.value,a:PLANS[c.value]})),cn=$('qn').value.trim(),ca=+$('qa').value;if(cn&&ca>0)it.push({n:cn,a:ca});if(!it.length){toast('Select a service or add a custom item');return}const d=Math.min(100,Math.max(0,+$('qd').value||0)),g=$('qg').checked,sub=it.reduce((a,x)=>a+x.a,0),aft=sub*(1-d/100),tot=Math.round(g?aft*1.18:aft),v=new Date(Date.now()+(+$('qv').value||7)*864e5).toISOString();l.quotes=l.quotes||[];l.quotes.push({no:'QT-'+String(Date.now()).slice(-6),items:it,disc:d,gst:g,sub,total:tot,valid:v,status:'Draft'});log(l,'Quotation created: '+inr(tot));save();render()}
function qSent(id,i){setTimeout(()=>{const l=find(id);l.quotes[i].status='Sent';log(l,'Quotation sent: '+l.quotes[i].no);if(l.stage<5)setStage(l,5,true);save();render()},300)}
function qSet(id,i,s){const l=find(id),q=l.quotes[i];q.status=s;log(l,'Quotation '+q.no+' '+s.toLowerCase());if(s=='Accepted'){l.invoices.push({no:'TC-'+String(Date.now()).slice(-6),plan:q.items.map(x=>x.n).join(', '),amt:q.sub,gst:q.gst,total:q.total,paid:false});log(l,'Invoice created from '+q.no)}save();render()}
function nu(){return `<div class="box"><h3>Automatic nurture sequences</h3><p style="color:var(--mu);font-size:13px">Each sequence creates timed tasks with the WhatsApp message ready. Open Follow-ups and tap Send. Sequences start and stop on their own when a lead’s stage changes.</p>${Object.keys(SEQ).map(k=>{const n=new Set(S.leads.filter(l=>l.tasks.some(t=>t.seq==k&&!t.done)).map(l=>l.id)).size;return `<div class="li"><b>${SEQ[k].n}</b> <span class="tag">${n} leads active</span><small>${SEQ[k].s.map(s=>(s[0]<24?'+'+Math.round(s[0]*60)+' min':'Day '+Math.round(s[0]/24))+': '+TP[s[1]].n).join(' → ')}</small></div>`}).join('')}<p>Rules: new lead → Welcome. Call booked → welcome stops. Quotation sent → Quotation follow-up. Won → Onboarding. Lost → Revival after 30 days. No-show → Recovery.</p></div>`}

 if(!S.leads.length){[['Rahul Verma','9876500011','Verma IAS Academy','Jaipur','50 lakh - 1 crore','Meta · Lead quality'],['Neha Singh','9876500022','Edge JEE Classes','Kota','1 - 2 crore','Meta · Follow-up system'],['Amit Joshi','9876500033','Sunrise Coaching','Indore','Under 50 lakh','Meta · Not enough leads']].forEach((a,i)=>{addLead({name:a[0],phone:a[1],inst:a[2],city:a[3],turnover:a[4],campaign:a[5]},'Meta Lead Ad',true);if(i==1)setStage(S.leads[0],2,true)});save()}}

function addLead(d,src,quiet){const l={id:uid(),name:d.name,phone:d.phone,email:d.email||'',prio:'Warm',quotes:[],inst:d.inst||'',city:d.city||'',turnover:d.turnover||'',campaign:d.campaign||'Direct',source:src,stage:0,created:now(),log:[],tasks:[],diag:{},meeting:'',invoices:[]};
 log(l,'Captured from '+src);log(l,'WhatsApp welcome message queued');addTask(l,'Call the lead within 1 hour',1);enroll(l,'welcome');S.leads.unshift(l);if(!quiet){save();render()}return l}

 const calls=L.filter(l=>l.stage>=2&&l.stage!=7).length,won=L.filter(l=>l.stage==6).length,mx=Math.max(1,...ST.map((s,i)=>L.filter(l=>l.stage==i).length));
 const camps={};L.forEach(l=>{const c=camps[l.campaign]=camps[l.campaign]||{n:0,c:0,w:0};c.n++;if(l.stage>=2&&l.stage!=7)c.c++;if(l.stage==6)c.w++});

 <div class="box"><h3>Funnel</h3>${ST.map((s,i)=>{const n=L.filter(l=>l.stage==i).length;return `<div class="bar"><em>${s}</em><i style="width:${n/mx*60}%"></i>${n}</div>`}).join('')}</div>
 <div class="box"><h3>Which ad is working</h3><div class="tw"><table><tr><th>Campaign</th><th>Leads</th><th>Calls</th><th>Won</th></tr>${Object.keys(camps).map(k=>`<tr><td>${esc(k)}</td><td>${camps[k].n}</td><td>${camps[k].c}</td><td>${camps[k].w}</td></tr>`).join('')}</table></div></div>`}
function pipe(){return `<input placeholder="Search name, institute, phone or ad" value="${esc(S.q)}" oninput="S.q=this.value;$('bd').innerHTML=board()" style="margin-bottom:10px"><div id="bd">${board()}</div>`}

 return `<div class="box"><h3>Retargeting audience</h3><p>Pick a stage, copy the list, and upload it in Meta Ads Manager as a Custom Audience.</p><div class="r2"><select onchange="S.seg=this.value;render()">${ST.map((s,i)=>`<option value="${i}" ${S.seg==i?'selected':''}>${s}</option>`).join('')}</select><span>${L.length} leads</span></div><label>Audience list (CSV)</label><textarea rows="8" readonly onclick="this.select()">${esc(csv)}</textarea><p style="color:var(--mu);font-size:13px">Ideas: “Call booked” but not done → reminder ad. “Proposal sent” → testimonial ad. “Lost” → new offer after 30 days.</p></div>`}

 if(S.dt=='wa'){const k=S.wk||'welcome';b=`<label>Template</label><select onchange="S.wk=this.value;render()">${Object.keys(TP).map(x=>`<option value="${x}" ${x==k?'selected':''}>${TP[x].n}</option>`).join('')}</select><label>Message (edit before sending)</label><textarea id="wt" rows="9" oninput="$('wl').href=waLink(find(S.open),null,this.value)">${esc(fill(getTpl(k),l))}</textarea><div class="row"><a id="wl" class="b p" target="_blank" rel="noopener" href="${waLink(l,k)}" onclick="log(find('${l.id}'),'WhatsApp: ${TP[k].n}');save()">Open in WhatsApp</a></div><p style="color:var(--mu);font-size:13px">Change the wording of any template in the Templates tab.</p>`}
 if(S.dt=='iv')b=`<label>Plan</label><div class="row"><select id="pl" style="flex:1">${Object.keys(PLANS).map(p=>`<option>${p}</option>`).join('')}</select><label style="margin:0"><input type="checkbox" id="gs" style="width:auto" checked> GST 18%</label><button class="b p" onclick="mkInv()">Create invoice</button></div>${l.invoices.map((v,i)=>`<div class="li"><b>${esc(v.no)} · ${esc(v.plan)}</b><small>Total ${inr(v.total)}${v.gst?' incl. GST':''} · ${v.paid?'Paid':'Unpaid'}</small><div class="row">${v.paid?'':`<button class="b s" onclick="pay('${l.id}',${i})">Mark paid</button>`}<a class="b s" target="_blank" rel="noopener" href="https://wa.me/91${l.phone.replace(/\D/g,'').slice(-10)}?text=${encodeURIComponent('Invoice '+v.no+' for '+v.plan+': '+inr(v.total)+'. Tatva Consulting')}">Send on WhatsApp</a></div></div>`).join('')}`;
 if(S.dt=='qt')b=`<label>Services</label>${Object.keys(PLANS).map(p=>`<div class="row"><label style="margin:0"><input type="checkbox" class="qc" value="${esc(p)}" style="width:auto"> ${esc(p)} · ${inr(PLANS[p])}</label></div>`).join('')}<div class="r2"><div><label>Custom item</label><input id="qn" placeholder="e.g. Funnel setup"></div><div><label>Custom amount (₹)</label><input id="qa" inputmode="numeric"></div><div><label>Discount %</label><input id="qd" inputmode="numeric" value="0"></div><div><label>Valid for (days)</label><input id="qv" inputmode="numeric" value="7"></div></div><div class="row"><label style="margin:0"><input type="checkbox" id="qg" style="width:auto" checked> GST 18%</label><button class="b p" onclick="mkQ()">Create quotation</button></div>${(l.quotes||[]).map((q,i)=>`<div class="li"><b>${esc(q.no)} · ${inr(q.total)}</b><small>${esc(q.items.map(x=>x.n).join(', '))} · valid till ${fdate(q.valid)} · ${q.status}</small><div class="row"><a class="b s" target="_blank" rel="noopener" href="${waLink(l,'quote',null,q)}" onclick="qSent('${l.id}',${i})">Send on WhatsApp</a><button class="b s" onclick="qSet('${l.id}',${i},'Accepted')">Accepted</button><button class="b s" onclick="qSet('${l.id}',${i},'Rejected')">Rejected</button></div></div>`).join('')}`;
 if(S.dt=='tl')b=`<div class="row"><input id="nt" placeholder="Add a note…" style="flex:1"><button class="b" onclick="addNote()">Add</button></div>`+l.log.map(x=>`<div class="li">${esc(x.t)}<small>${fd(x.at)}</small></div>`).join('');
 $('pn').innerHTML=`<div class="row"><div><b style="font-size:17px">${esc(l.name)}</b><div style="color:var(--mu)">${esc(l.inst)}${l.city?', '+esc(l.city):''}</div></div><button class="b s" style="margin-left:auto" onclick="closeD()">Close</button></div><div class="tabs">${T.map(t=>`<button class="nb ${S.dt==t[0]?'on':''}" onclick="S.dt='${t[0]}';render()">${t[1]}</button>`).join('')}</div>${b}`}
function newT(){const l=find(S.open),t=$('tt').value.trim();if(!t)return;addTask(l,t,+$('th').value);save();render()}
function book(){const l=find(S.open),v=$('mtv').value;if(!v){toast('Pick a date and time');return}l.meeting=v;l.tasks=l.tasks.filter(t=>!/^Send call reminder/.test(t.t)||t.done);log(l,'Call booked for '+fd(v));const ms=new Date(v).getTime();[[864e5,'1 day','remind1d'],[36e5,'1 hour','remind1h'],[6e5,'10 minutes','remind10']].filter(a=>ms-a[0]>Date.now()).forEach(a=>l.tasks.push({t:'Send call reminder ('+a[1]+' before)',due:new Date(ms-a[0]).toISOString(),done:false,wa:a[2]}));if(l.stage<2)setStage(l,2,true);addTask(l,'Send booking confirmation',0.05,'confirm');save();render()}
function mkInv(){const l=find(S.open),p=$('pl').value,g=$('gs').checked,a=PLANS[p],t=g?Math.round(a*1.18):a;l.invoices.push({no:'TC-'+String(Date.now()).slice(-6),plan:p,amt:a,gst:g,total:t,paid:false});log(l,'Invoice created: '+p+' '+inr(t));if(l.stage<5)setStage(l,5,true);save();render()}
function pay(id,i){const l=find(id);l.invoices[i].paid=true;log(l,'Payment received '+inr(l.invoices[i].total));setStage(l,6,true);save();render()}
load();render();
</script><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const C=S.cfg;
C.biz=Object.assign({addr:'',gstin:'',phone:'',email:'',sac:'998311',bank:'',terms:'50% advance to begin work. Balance as agreed. Taxes extra unless stated.'},C.biz||{});
C.trig=C.trig||{new:'welcome',5:'proposal',6:'onboard',7:'revive'};C.custom=C.custom||{};
(C.stg||[]).forEach((n,i)=>{if(n)ST[i]=n});
if(C.seq){Object.keys(SEQ).forEach(k=>delete SEQ[k]);Object.assign(SEQ,C.seq)}
Object.assign(TP,C.custom);
const sv=()=>{C.seq=SEQ;saveCfg()};
const ini=n=>String(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const COL=['#94a3b8','#60a5fa','#a78bfa','#f59e0b','#14b8a6','#6366f1','#22c55e','#ef4444'];
const NAV=[['dash','Dashboard','◫'],['leads','Leads','☰'],['pipe','Pipeline','▥'],['fu','Follow-ups','✓'],['nu','Nurture','↻'],['tp','Templates','✎'],['rt','Audiences','◎'],['set','Connect','⚡'],['bk','Import / Export','⇅'],['cf','Settings','⚙']];
function getTpl(k){return C.tpl[k]||(TP[k]||{t:''}).t}
function auto(l,k){const s=C.trig[k];if(s&&SEQ[s])enroll(l,s)}
function addLead(d,src,quiet){const l={id:uid(),name:d.name,phone:d.phone,email:d.email||'',prio:'Warm',quotes:[],inst:d.inst||'',city:d.city||'',turnover:d.turnover||'',campaign:d.campaign||'Direct',source:src,stage:0,created:now(),log:[],tasks:[],diag:{},meeting:'',invoices:[]};log(l,'Captured from '+src);addTask(l,'Call the lead within 1 hour',1);auto(l,'new');S.leads.unshift(l);if(!quiet){save();render()}return l}
function setStage(l,i,quiet){l.stage=i;log(l,'Stage → '+ST[i]);if(i==3)addTask(l,'Prepare diagnosis audit report',24);if(i==4)addTask(l,'Present audit and recommend a plan',24,'audit');if(i>=2)l.tasks=l.tasks.filter(t=>t.done||(t.seq!='welcome'&&t.seq!='noshow'));auto(l,i);if(!quiet){save();render()}}
function render(){
 $('nav').innerHTML=NAV.map(a=>`<button class="nb ${S.tab==a[0]?'on':''}" onclick="S.tab='${a[0]}';S.open=null;$('dr').classList.remove('on');render()"><i>${a[2]}</i><span>${a[1]}</span></button>`).join('')+`<button class="b p add" onclick="addForm()">+ Add lead</button>`;
 const hd=({dash:'Dashboard',rt:'Audiences'})[S.tab];
 $('m').innerHTML=(hd?`<div class="hd"><h2>${hd}</h2></div>`:'')+({dash,leads,pipe,fu,nu,tp,rt,set,bk,cf})[S.tab]();
 drawer();
 if(S.open&&S.open!='new'&&S.open!='exp'&&S.dt=='qt'){const l=find(S.open),t=$('pn').querySelector('.tabs');if(l&&t){while(t.nextSibling)t.nextSibling.remove();t.insertAdjacentHTML('afterend',qtab(l))}}}
/* leads table, filters, export */
function vis(){const f=S.f=S.f||{q:'',st:'',src:'',pr:''},q=f.q.toLowerCase();return S.leads.filter(l=>(!q||(l.name+l.inst+l.phone+l.email+l.campaign).toLowerCase().includes(q))&&(f.st===''||l.stage==f.st)&&(!f.src||l.source==f.src)&&(!f.pr||(l.prio||'Warm')==f.pr))}
function rows(){return vis().map(l=>`<tr onclick="openL('${l.id}')"><td><span class="av">${ini(l.name)}</span> <b>${esc(l.name)}</b></td><td>${esc(l.inst)}</td><td>${esc(l.phone)}</td><td>${esc(l.source)}</td><td><span class="chip">${esc(ST[l.stage])}</span></td><td>${esc(l.prio||'Warm')}</td><td>${fd(l.log[0]&&l.log[0].at||l.created)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">No leads match.</td></tr>'}
function leads(){const f=S.f=S.f||{q:'',st:'',src:'',pr:''},srcs=[...new Set(S.leads.map(l=>l.source))];
 return `<div class="hd"><h2>Leads <small>${vis().length}</small></h2><div class="row"><button class="b" onclick="exp()">Export CSV</button><button class="b" onclick="S.tab='bk';render()">Import</button></div></div><div class="fl"><input placeholder="Search name, institute, phone…" value="${esc(f.q)}" oninput="S.f.q=this.value;$('lt').innerHTML=rows()"><select onchange="S.f.st=this.value;render()"><option value="">All stages</option>${ST.map((s,i)=>`<option value="${i}" ${f.st!==''&&f.st==i?'selected':''}>${esc(s)}</option>`).join('')}</select><select onchange="S.f.src=this.value;render()"><option value="">All sources</option>${srcs.map(s=>`<option ${f.src==s?'selected':''}>${esc(s)}</option>`).join('')}</select><select onchange="S.f.pr=this.value;render()"><option value="">Any priority</option>${['Hot','Warm','Cold'].map(s=>`<option ${f.pr==s?'selected':''}>${s}</option>`).join('')}</select></div><div class="card0 tw"><table><thead><tr><th>Lead</th><th>Institute</th><th>Phone</th><th>Source</th><th>Stage</th><th>Priority</th><th>Last activity</th></tr></thead><tbody id="lt">${rows()}</tbody></table></div>`}
function csvOut(L){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';return ['Name,Phone,Email,Institute,City,Source,Campaign,Stage,Priority,Created'].concat(L.map(l=>[l.name,l.phone,l.email,l.inst,l.city,l.source,l.campaign,ST[l.stage],l.prio||'Warm',l.created].map(q).join(','))).join('\n')}
function exp(){S.open='exp';$('dr').classList.add('on');$('pn').innerHTML=`<div class="row"><b>Export ${vis().length} leads (CSV)</b><button class="b s" style="margin-left:auto" onclick="closeD()">Close</button></div><p class="mu">Press Copy, then paste into Excel or Google Sheets, or save as a .csv file.</p><textarea id="ex" rows="14" readonly onclick="this.select()">${esc(csvOut(vis()))}</textarea><div class="row"><button class="b p" onclick="$('ex').select();try{document.execCommand('copy');toast('Copied')}catch(e){toast('Press Ctrl+C')}">Copy</button></div>`}
/* pipeline with drag and drop */
function pipe(){return `<div class="hd"><h2>Pipeline</h2><input placeholder="Search…" value="${esc(S.q)}" oninput="S.q=this.value;$('bd').innerHTML=board()" style="max-width:260px"></div><div id="bd">${board()}</div>`}
function nextT(l){const t=l.tasks.filter(x=>!x.done).sort((a,b)=>new Date(a.due)-new Date(b.due))[0];return t?`<small class="${new Date(t.due)<new Date()?'late':''}">${esc(t.t)}</small>`:''}
function board(){const q=(S.q||'').toLowerCase();return `<div class="board">${ST.map((s,i)=>{const c=S.leads.filter(l=>l.stage==i&&(!q||(l.name+l.inst+l.phone+l.campaign).toLowerCase().includes(q)));return `<div class="col" style="--c:${COL[i]}" ondragover="event.preventDefault()" ondrop="dropTo(${i})"><h4>${esc(s)}<span>${c.length}</span></h4>${c.map(l=>`<div class="card" draggable="true" ondragstart="S.drag='${l.id}'" tabindex="0" onclick="openL('${l.id}')" onkeydown="if(event.key=='Enter')openL('${l.id}')"><div class="row"><span class="av">${ini(l.name)}</span><div><b>${esc(l.name)}</b><br><small>${esc(l.inst)}</small></div></div><div class="row"><span class="chip">${esc(l.prio||'Warm')}</span><span class="chip">${esc(l.campaign)}</span></div>${nextT(l)}</div>`).join('')}</div>`}).join('')}</div>`}
function dropTo(i){const l=find(S.drag);if(l&&l.stage!=i)setStage(l,i)}
/* follow-ups */
function frow(x){const late=new Date(x.k.due)<new Date();return `<div class="fr"><button class="ck" aria-label="Mark done" onclick="doneT('${x.l.id}',${x.i})"></button><div class="fm"><b>${esc(x.k.t)}</b><span><i class="av">${ini(x.l.name)}</i>${esc(x.l.name)}${x.l.inst?' · '+esc(x.l.inst):''}</span></div><span class="chip ${late?'late':''}">${fd(x.k.due)}</span><div class="fa">${x.k.wa?`<a class="b s p" target="_blank" rel="noopener" href="${waLink(x.l,x.k.wa)}" onclick="sentWa('${x.l.id}',${x.i})">WhatsApp</a>`:''}<button class="b s" onclick="snooze('${x.l.id}',${x.i})">+1 day</button><button class="b s" onclick="openL('${x.l.id}')">Open</button></div></div>`}
function fu(){const T=S.leads.flatMap(l=>l.tasks.map((k,i)=>({l,k,i}))).filter(x=>!x.k.done).sort((a,b)=>new Date(a.k.due)-new Date(b.k.due)),e=new Date();e.setHours(23,59,59,999);const g={Overdue:[],Today:[],Upcoming:[]};T.forEach(x=>{const d=new Date(x.k.due);(d<new Date()?g.Overdue:d<=e?g.Today:g.Upcoming).push(x)});
 return `<div class="hd"><h2>Follow-ups <small>${T.length}</small></h2></div>`+(T.length?Object.keys(g).map(k=>g[k].length?`<h4 class="gh ${k=='Overdue'?'late':''}">${k} · ${g[k].length}</h4>`+g[k].map(frow).join(''):'').join(''):'<div class="empty">All clear. New leads and nurture sequences create tasks automatically.</div>')}
/* nurture builder */
function tpo(s){return Object.keys(TP).map(k=>`<option value="${k}" ${k==s?'selected':''}>${esc(TP[k].n)}</option>`).join('')}
function nu(){const ks=Object.keys(SEQ),k=SEQ[S.ns]?S.ns:ks[0];S.ns=k;const q=SEQ[k];if(!q)return `<div class="hd"><h2>Nurture</h2><button class="b p" onclick="newSeq()">+ New sequence</button></div><div class="empty">No sequences yet.</div>`;const tr=Object.keys(C.trig).find(t=>C.trig[t]==k)||'';
 return `<div class="hd"><h2>Nurture</h2><button class="b p" onclick="newSeq()">+ New sequence</button></div><div class="two"><div class="card0">${ks.map(x=>{const n=new Set(S.leads.filter(l=>l.tasks.some(t=>t.seq==x&&!t.done)).map(l=>l.id)).size;return `<div class="sq ${x==k?'on':''}" onclick="S.ns='${x}';render()"><b>${esc(SEQ[x].n)}</b><small>${SEQ[x].s.length} steps · ${n} leads active</small></div>`}).join('')}</div><div class="card0 pad"><label>Name</label><input value="${esc(q.n)}" oninput="SEQ['${k}'].n=this.value;sv()"><label>Starts automatically when</label><select onchange="setTrig('${k}',this.value)"><option value="">Manual only</option><option value="new" ${tr=='new'?'selected':''}>A new lead arrives</option>${[2,3,4,5,6,7].map(n=>`<option value="${n}" ${tr==n?'selected':''}>Lead moves to “${esc(ST[n])}”</option>`).join('')}</select><h4>Steps</h4>${q.s.map((s,i)=>`<div class="stp"><span class="mu">Day</span><input type="number" step="0.1" min="0" value="${+(s[0]/24).toFixed(2)}" onchange="stp('${k}',${i},0,this.value*24)"><select onchange="stp('${k}',${i},1,this.value)">${tpo(s[1])}</select><button class="b s" onclick="SEQ['${k}'].s.splice(${i},1);sv();render()">✕</button></div>`).join('')}<div class="row"><button class="b" onclick="SEQ['${k}'].s.push([24,'nudge','Send: Gentle nudge']);sv();render()">+ Add step</button><button class="b s" onclick="delSeq('${k}')">${S.dq==k?'Tap again to delete':'Delete sequence'}</button></div><p class="mu">Each step becomes a follow-up task with the WhatsApp message ready. Changes apply to leads who enter the sequence from now on.</p></div></div>`}
function stp(k,i,j,v){const s=SEQ[k].s[i];s[j]=j==0?+v:v;if(j==1)s[2]='Send: '+TP[v].n;sv();render()}
function setTrig(k,t){Object.keys(C.trig).forEach(x=>{if(C.trig[x]==k)delete C.trig[x]});if(t)C.trig[t]=k;sv();render()}
function newSeq(){const k='c'+uid();SEQ[k]={n:'New sequence',s:[[24,'nudge','Send: Gentle nudge']]};S.ns=k;sv();render()}
function delSeq(k){if(S.dq!=k){S.dq=k;render();return}delete SEQ[k];Object.keys(C.trig).forEach(x=>{if(C.trig[x]==k)delete C.trig[x]});S.dq=null;sv();render()}
/* templates */
function ins(v){const t=S.ft;if(!t)return;t.setRangeText('{'+v+'}',t.selectionStart,t.selectionEnd,'end');t.dispatchEvent(new Event('input'));t.focus()}
function newTp(){const n=$('tn').value.trim();if(!n){toast('Enter a template name');return}const k='x'+uid();C.custom[k]={n,t:'Namaste {name} ji,\n'};TP[k]=C.custom[k];saveCfg();render()}
function delTp(k){delete TP[k];delete C.custom[k];saveCfg();render()}
function tp(){return `<div class="hd"><h2>Templates</h2></div><div class="card0 pad"><b>New custom template</b><div class="row"><input id="tn" placeholder="Name, e.g. Fee reminder" style="flex:1"><button class="b p" onclick="newTp()">Create</button></div></div><div class="card0 pad"><b>Insert a variable</b> <span class="mu">(click inside a template first)</span><div class="row">${['name','inst','me','co','book','time','items','amount','valid','qno','plan','upi'].map(v=>`<button class="chip" onmousedown="event.preventDefault()" onclick="ins('${v}')">{${v}}</button>`).join('')}</div></div>${Object.keys(TP).map(k=>{const cu=C.custom[k];return `<div class="card0 pad"><div class="row">${cu?`<input value="${esc(TP[k].n)}" oninput="TP['${k}'].n=this.value;saveCfg()" style="flex:1">`:`<b style="flex:1">${esc(TP[k].n)}</b>`}<button class="b s" onclick="${cu?`delTp('${k}')`:`setTpl('${k}','');render()`}">${cu?'Delete':'Reset'}</button></div><textarea rows="4" onfocus="S.ft=this" oninput="${cu?`TP['${k}'].t=this.value;saveCfg()`:`setTpl('${k}',this.value)`}">${esc(getTpl(k))}</textarea></div>`}).join('')}<p class="mu">For the WhatsApp Cloud API, Meta must approve each template. Replace the variables with {{1}}, {{2}} and so on, in the same order.</p>`}
/* quotation and invoice builder */
function qtab(l){return `<div class="row"><button class="b p" onclick="openDoc('${l.id}','Quotation')">+ Quotation</button><button class="b" onclick="openDoc('${l.id}','Tax invoice')">+ Tax invoice</button></div>`+(l.quotes||[]).map((q,i)=>`<div class="li"><b>${esc(q.no)} · ${inr(q.total)}</b><small>${esc(q.type||'Quotation')} · ${esc(q.items.map(x=>x.n).join(', '))} · valid till ${fdate(q.valid)} · ${q.status}</small><div class="row"><button class="b s" onclick="openDoc('${l.id}','',${i})">Open</button><a class="b s" target="_blank" rel="noopener" href="${waLink(l,'quote',null,q)}" onclick="qSent('${l.id}',${i})">WhatsApp</a><button class="b s" onclick="qSet('${l.id}',${i},'Accepted')">Accepted</button><button class="b s" onclick="qSet('${l.id}',${i},'Rejected')">Rejected</button></div></div>`).join('')}
function calc(d){const sub=d.rows.reduce((a,r)=>a+(+r.q||0)*(+r.a||0),0),dsc=sub*(+d.disc||0)/100,tx=sub-dsc,g=tx*(+d.gstr||0)/100;return{sub,dsc,tx,g,total:Math.round(tx+g)}}
function openDoc(id,type,qi,kind){const l=find(id);S.dl=id;kind=kind||'q';let d;
 if(qi>=0){d=JSON.parse(JSON.stringify(kind=='i'?l.invoices[qi].doc:l.quotes[qi]));d.qi=qi;d.kind=kind;d.rows=d.rows||(d.items||[]).map(x=>({n:x.n,q:1,a:x.a}));d.date=d.date||now();d.vd=d.vd||7;d.gstr=d.gstr==null?(d.gst?18:0):d.gstr;d.type=d.type||'Quotation';d.notes=d.notes||'';d.disc=d.disc||0}
 else{const inv=type=='Tax invoice';d={type,kind:inv?'i':'q',qi:-1,no:(inv?'INV-':'QT-')+String(Date.now()).slice(-6),date:now(),vd:7,rows:[{n:'',q:1,a:0}],disc:0,gstr:18,notes:'',status:'Draft'}}
 S.dd=d;$('dc').classList.add('on');$('dc').innerHTML=`<div class="dbar noprint"><b>${esc(d.type)} · ${esc(l.name)}</b><span style="flex:1"></span><a id="wl2" class="b" target="_blank" rel="noopener" href="#">Send on WhatsApp</a><button class="b" onclick="window.print()">Print / PDF</button><button class="b p" onclick="saveDoc()">Save</button><button class="b" onclick="closeDoc()">Close</button></div><div class="dwrap"><div class="ded noprint" id="ded"></div><div class="paper" id="pp"></div></div>`;edr();ref()}
function edr(){const d=S.dd;$('ded').innerHTML=`<label>Document type</label><select onchange="S.dd.type=this.value;S.dd.kind=this.value=='Tax invoice'?'i':'q';ref()">${['Quotation','Proforma invoice','Tax invoice'].map(t=>`<option ${d.type==t?'selected':''}>${t}</option>`).join('')}</select><div class="r2"><div><label>Number</label><input value="${esc(d.no)}" oninput="S.dd.no=this.value;ref()"></div><div><label>Valid for (days)</label><input type="number" value="${d.vd}" oninput="S.dd.vd=+this.value;ref()"></div></div><label>Items · description, qty, rate</label>${d.rows.map((r,i)=>`<div class="irow"><input placeholder="Description" value="${esc(r.n)}" oninput="S.dd.rows[${i}].n=this.value;ref()"><input type="number" min="0" value="${r.q}" oninput="S.dd.rows[${i}].q=+this.value;ref()"><input type="number" min="0" value="${r.a}" oninput="S.dd.rows[${i}].a=+this.value;ref()"><button class="b s" onclick="S.dd.rows.splice(${i},1);edr();ref()">✕</button></div>`).join('')}<div class="row"><button class="b s" onclick="S.dd.rows.push({n:'',q:1,a:0});edr()">+ Line</button>${Object.keys(PLANS).map(p=>`<button class="chip" onclick="S.dd.rows.push({n:'${p} plan',q:1,a:${PLANS[p]}});edr();ref()">+ ${p}</button>`).join('')}</div><div class="r2"><div><label>Discount %</label><input type="number" value="${d.disc}" oninput="S.dd.disc=+this.value;ref()"></div><div><label>GST %</label><select onchange="S.dd.gstr=+this.value;ref()">${[0,5,12,18].map(g=>`<option ${d.gstr==g?'selected':''}>${g}</option>`).join('')}</select></div></div><label>Notes for this document</label><textarea rows="3" oninput="S.dd.notes=this.value;ref()">${esc(d.notes)}</textarea><p class="mu">Business details and terms come from Settings.</p>`}
function ref(){const l=find(S.dl),d=S.dd,c=calc(d);d.total=c.total;d.sub=c.sub;d.gst=d.gstr>0;d.valid=new Date(new Date(d.date).getTime()+(d.vd||7)*864e5).toISOString();d.items=d.rows.filter(r=>r.n).map(r=>({n:r.n+((+r.q||1)>1?' × '+r.q:''),a:(+r.q||0)*(+r.a||0)}));if(!d.items.length)d.items=[{n:'—',a:0}];$('pp').innerHTML=paper(l,d,c);const w=$('wl2');if(w)w.href=waLink(l,d.type=='Tax invoice'?'invoice':'quote',null,d)}
function paper(l,d,c){const b=C.biz,inv=d.type=='Tax invoice',m=n=>inr(Math.round(n*100)/100),br=s=>esc(s).replace(/\n/g,'<br>');
 return `<div class="ph"><div><h3>${esc(C.co)}</h3><div class="mu">${br(b.addr)}${b.gstin?'<br>GSTIN: '+esc(b.gstin):''}${b.phone?'<br>'+esc(b.phone):''}${b.email?' · '+esc(b.email):''}</div></div><div style="text-align:right"><h2>${esc(d.type.toUpperCase())}</h2><div>No: <b>${esc(d.no)}</b></div><div>Date: ${fdate(d.date)}</div>${inv?'':`<div>Valid till: ${fdate(d.valid)}</div>`}</div></div><div class="pb"><small class="mu">BILL TO</small><b>${esc(l.name)}</b>${esc(l.inst)}${l.city?', '+esc(l.city):''}<br>${esc(l.phone)}${l.email?' · '+esc(l.email):''}</div><table><tr><th>#</th><th>Description</th>${inv?'<th>SAC</th>':''}<th class="r">Qty</th><th class="r">Rate</th><th class="r">Amount</th></tr>${d.rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.n)}</td>${inv?`<td>${esc(b.sac)}</td>`:''}<td class="r">${+r.q||0}</td><td class="r">${m(+r.a||0)}</td><td class="r">${m((+r.q||0)*(+r.a||0))}</td></tr>`).join('')}</table><div class="tot"><div><span>Subtotal</span><span>${m(c.sub)}</span></div>${d.disc?`<div><span>Discount (${d.disc}%)</span><span>− ${m(c.dsc)}</span></div>`:''}${d.gstr?`<div><span>CGST ${d.gstr/2}%</span><span>${m(c.g/2)}</span></div><div><span>SGST ${d.gstr/2}%</span><span>${m(c.g/2)}</span></div>`:''}<div class="gt"><span>Total</span><span>${inr(c.total)}</span></div></div>${d.notes?`<div class="pn2"><small class="mu">NOTES</small><div>${br(d.notes)}</div></div>`:''}<div class="pn2"><small class="mu">TERMS</small><div>${br(b.terms)}</div></div><div class="pn2"><small class="mu">PAYMENT</small><div>${esc(C.upi)}${b.bank?'<br>'+br(b.bank):''}</div></div><div class="sig">Authorised signatory<br><b>${esc(C.co)}</b></div>`}
function saveDoc(){const l=find(S.dl),d=S.dd;ref();const o=JSON.parse(JSON.stringify(d));
 if(d.kind=='i'){const v={no:d.no,plan:d.items.map(x=>x.n).join(', '),amt:d.sub,gst:d.gst,total:d.total,paid:false,doc:o};if(d.qi>=0)Object.assign(l.invoices[d.qi],v,{paid:l.invoices[d.qi].paid});else l.invoices.push(v)}
 else{if(d.qi>=0)Object.assign(l.quotes[d.qi],o);else l.quotes.push(o)}
 log(l,d.type+' saved: '+d.no);save();toast('Saved');closeDoc()}
function closeDoc(){$('dc').classList.remove('on');$('dc').innerHTML='';render()}
/* connect, import/export, settings */
function set(){const I=[['Meta Lead Ads','Import CSV now','Live: webhook + Graph API','Ads Manager → Leads → Download, then Import / Export → Import. Live: Meta sends a webhook for each new lead, your server fetches the details and calls POST /api/leads.'],['Google Ads lead forms','Import CSV now','Live: lead-form webhook','Download the leads and import them. Live: add your server webhook URL and key in the Google Ads lead form settings.'],['Google Sheets / Excel','Paste or upload now','Live: Make, n8n or Apps Script','Paste rows or upload .xlsx or .csv. Live: a script posts every new row to POST /api/leads.'],['WhatsApp','Tap to send now','Live: Cloud API or provider','Templates open in WhatsApp with the text filled. Live: your server calls the API, and replies come back by webhook.'],['Google Calendar','Calendar link now','Live: Cal.com webhook or Calendar API','The Meeting tab has an Add to Google Calendar button. Live: a booking webhook moves the lead to Call booked.'],['Razorpay','Invoice on WhatsApp now','Live: payment links + webhook','Share the invoice and UPI details now. Live: a payment webhook marks the invoice paid and the lead Won.'],['Zapier / Make / n8n','Needs server','Inbound API + outbound webhooks','Inbound: POST /api/leads with your key. Outbound: the CRM posts events to your URL.'],['Meta Conversions API','Needs server','Server events','Send Lead, Schedule and Purchase events with the lead ID so Meta learns who becomes a client.']];
 return `<div class="hd"><h2>Connect</h2><button class="b p" onclick="sim()">Send a test lead</button></div><p class="mu">CSV, Excel and Sheets work in this page today. Live connections need the backend server, which keeps your keys safe.</p><div class="grid">${I.map(x=>`<details class="card0 pad"><summary><b>${x[0]}</b><span class="chip ok">${x[1]}</span><span class="chip">${x[2]}</span></summary><p>${x[3]}</p></details>`).join('')}</div><div class="card0 pad"><b>Lead API (for your server, Zapier, Make, n8n)</b><pre>POST /api/leads\nx-api-key: YOUR_KEY\n\n{ "name": "Rahul Verma", "phone": "9876500011",\n  "email": "rahul@example.com", "institute": "Verma IAS Academy",\n  "city": "Jaipur", "source": "Meta Lead Ad",\n  "campaign": "Follow-up system" }</pre><b>Events the CRM sends out (webhooks)</b><pre>lead.created · lead.stage_changed · call.booked\nquotation.sent · quotation.accepted · invoice.paid</pre></div>`}
function bk(){return `<div class="hd"><h2>Import / Export</h2></div><div class="card0 pad"><b>Import leads</b><p class="mu">From Meta, Google Ads, Google Sheets, Excel or any CSV. Upload a file, or paste rows (copy them from Sheets or Excel with the header row).</p><div class="r2"><div><label>Source</label><select id="isrc">${['Meta Lead Ad','Google Ads','Google Sheet','Excel / CSV','Website form','Referral'].map(s=>`<option>${s}</option>`).join('')}</select></div><div><label>File (.csv, .xlsx)</label><input type="file" accept=".csv,.xlsx,.xls,.tsv,.txt" onchange="pick(event)"></div></div><label>Or paste data</label><textarea id="csv" rows="6" oninput="prev()"></textarea><p class="mu" id="pv"></p><div class="row"><button class="b p" onclick="impCsv()">Import leads</button></div></div><div class="card0 pad"><b>Export</b><p class="mu">All leads as CSV, for Excel or Google Sheets.</p><button class="b" onclick="S.f=null;exp()">Export all leads</button></div><div class="card0 pad"><b>Backup and restore</b><p class="mu">Your data lives only in this browser. Keep a copy of this text somewhere safe.</p><textarea id="bkt" rows="5" onclick="this.select()">${esc(JSON.stringify(S.leads))}</textarea><div class="row"><button class="b p" onclick="restore()">Restore from the text above</button></div></div>`}
function pick(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();if(/\.xlsx?$/i.test(f.name)){if(!window.XLSX){toast('Excel reader did not load. Paste the data instead.');return}r.onload=()=>{try{const w=XLSX.read(r.result,{type:'array'});$('csv').value=XLSX.utils.sheet_to_csv(w.Sheets[w.SheetNames[0]]);prev()}catch(x){toast('Could not read that file')}};r.readAsArrayBuffer(f)}else{r.onload=()=>{$('csv').value=r.result;prev()};r.readAsText(f)}}
function prev(){const R=csvRows($('csv').value||'');$('pv').textContent=R.length>1?(R.length-1)+' rows found · columns: '+R[0].join(', '):''}
function impCsv(){const R=csvRows($('csv').value||'');if(R.length<2){toast('Add a file or paste data with a header row');return}const H=R[0].map(h=>h.toLowerCase().replace(/[^a-z]/g,'')),g=(r,ks)=>{for(const k of ks){const i=H.indexOf(k);if(i>-1&&r[i])return r[i]}return ''},src=$('isrc').value;let n=0,sk=0;
 R.slice(1).forEach(r=>{const p=g(r,['phonenumber','phone','mobile','mobilenumber','userphone','contactnumber','whatsapp','whatsappnumber']).replace(/\D/g,'').slice(-10),nm=g(r,['fullname','name','username','leadname'])||(g(r,['firstname'])+' '+g(r,['lastname'])).trim();if(!nm||p.length!=10||S.leads.some(l=>l.phone.replace(/\D/g,'').slice(-10)==p)){sk++;return}addLead({name:nm,phone:p,email:g(r,['email','useremail','emailaddress']),inst:g(r,['companyname','institutename','institute','organization','company']),city:g(r,['city','location']),campaign:src.split(' ')[0]+' · '+(g(r,['campaignname','adname','campaign'])||'Import')},src,true);n++});save();toast(n+' imported, '+sk+' skipped (duplicate or no valid number)');render()}
function cf(){const b=C.biz,f=(k,l,o)=>`<div><label>${l}</label><input value="${esc(o?C[k]:b[k])}" oninput="${o?`cfg('${k}',this.value)`:`C.biz.${k}=this.value;saveCfg()`}"></div>`;
 return `<div class="hd"><h2>Settings</h2></div><div class="card0 pad"><b>Business profile</b><p class="mu">Used on quotations, invoices and WhatsApp messages.</p><div class="r2">${f('co','Business name',1)}${f('me','Your name (sender)',1)}${f('gstin','GSTIN')}${f('phone','Phone')}${f('email','Email')}${f('sac','SAC code (invoices)')}${f('book','Booking link',1)}${f('upi','UPI ID or payment link',1)}</div><label>Address</label><textarea rows="2" oninput="C.biz.addr=this.value;saveCfg()">${esc(b.addr)}</textarea><label>Bank details (optional)</label><textarea rows="2" oninput="C.biz.bank=this.value;saveCfg()">${esc(b.bank)}</textarea><label>Standard terms</label><textarea rows="3" oninput="C.biz.terms=this.value;saveCfg()">${esc(b.terms)}</textarea><p class="mu">GST is shown as CGST + SGST (same-state billing).</p></div><div class="card0 pad"><b>Pipeline stages</b><p class="mu">Rename any stage. Stages 3 to 8 keep their automations: call booked, call done, audit ready, proposal sent, won, lost.</p><div class="r2">${ST.map((s,i)=>`<div><label>Stage ${i+1}</label><input value="${esc(s)}" oninput="ST[${i}]=this.value;C.stg=[...ST];saveCfg()"></div>`).join('')}</div></div>`}
render();
</script>
